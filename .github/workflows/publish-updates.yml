name: Build and publish Vinylstack

on:
  push:
    branches: [main]
    paths:
      - 'VinilStack.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
      - name: Prepare app from the public source archive
        shell: pwsh
        run: Expand-Archive -LiteralPath VinilStack.zip -DestinationPath app
      - name: Read version and skip if already released
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if (-not $package.version) { throw 'Could not read the app version.' }
          $tag = "v$($package.version)"
          $releaseUrl = "https://api.github.com/repos/gicu123464/Vinylstack-updates/releases/tags/$tag"
          $releaseExists = $false
          try {
            Invoke-RestMethod -Uri $releaseUrl -Headers @{ Accept = 'application/vnd.github+json' } | Out-Null
            $releaseExists = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if ($releaseExists) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; bump the app version in VinilStack.zip."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
            "version=$($package.version)" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Download media tools for the installer
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'app'
          New-Item -ItemType Directory -Force -Path $app/vendor | Out-Null
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile $app/vendor/yt-dlp.exe
          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'ffmpeg-gpl.zip'
          $ffmpegDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-gpl'
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $ffmpegZip
          Expand-Archive -LiteralPath $ffmpegZip -DestinationPath $ffmpegDir
          $ffmpeg = Get-ChildItem -LiteralPath $ffmpegDir -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg executable was not found in the downloaded GPL build.' }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination $app/vendor/ffmpeg.exe
          @'
          Vinylstack bundles FFmpeg for Windows audio conversion.
          Build project: https://github.com/BtbN/FFmpeg-Builds
          Source and license information: https://ffmpeg.org/legal.html
          FFmpeg source: https://github.com/FFmpeg/FFmpeg
          '@ | Set-Content -LiteralPath $app/vendor/FFmpeg-BUILD.txt -Encoding utf8
      - name: Install app dependencies
        if: steps.release.outputs.skip != 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build and publish the Windows installer and update feed
        if: steps.release.outputs.skip != 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          npx electron-builder --win nsis --publish always
          if (-not (Test-Path 'dist/latest.yml')) { throw 'The updater manifest latest.yml was not generated.' }
      - name: Attach the source archive to the release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ steps.release.outputs.tag }}" VinilStack.zip --repo gicu123464/Vinylstack-updates --clobber

